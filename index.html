<script>
const D={"key": "hist3_", "exam": "2026-11-24", "kicker": "Prova amanhã · revisão completa", "heroTitle": "Do pau-brasil à expulsão dos holandeses", "heroText": "Os 7 capítulos explicados com causa e consequência, linha do tempo, simulado com correção na hora, flashcards, dissertativas e vídeos.", "chapWord": "Capítulos", "chapWordOne": "Capítulo", "chapters": [{"id": "6", "n": "6", "title": "Período Pré-Colonial: a chegada dos portugueses", "short": "Pré-colonial", "hint": "Cabral, Tordesilhas, escambo e pau-brasil", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> Portugal chegou aqui procurando lucro. Como não achou ouro nem especiarias, por 30 anos só <b>explorou</b> a terra (pau-brasil), sem <b>ocupar</b> de verdade.</p>\n<h3>O contexto: as Grandes Navegações</h3>\n<p>No século XV, a Europa queria comprar <b>especiarias</b> (pimenta, cravo, canela) e outros produtos do Oriente, que valiam muito. As rotas por terra eram controladas por outros povos e tudo chegava caríssimo. Portugal, um país pequeno, mas com boa tecnologia náutica e um governo centralizado, decidiu buscar um <b>caminho pelo mar</b> até as Índias, contornando a África. Em 1498, <b>Vasco da Gama</b> conseguiu. A partir daí, a meta era transformar essa rota em um grande negócio.</p>\n<h3>Cabral: acaso ou plano?</h3>\n<p>Em 1500, <b>Pedro Álvares Cabral</b> partiu com uma grande esquadra rumo às Índias. Em <b>22 de abril de 1500</b>, avistou terra no litoral da atual Bahia. A versão tradicional diz que foi um <b>acaso</b>: correntes e ventos teriam desviado a frota. Muitos historiadores duvidam disso, porque o <b>Tratado de Tordesilhas (1494)</b> já garantia a Portugal terras a oeste no Atlântico. Ou seja, Portugal provavelmente já <b>suspeitava</b> que havia terra ali. A missão principal da viagem, porém, continuava sendo o comércio com a Índia.</p>\n<div class=\"two\">\n<div class=\"box\"><h4>Tratado de Tordesilhas (1494)</h4>Acordo entre Portugal e Espanha que dividiu as terras “descobertas e por descobrir” por uma linha imaginária. O que ficasse a <b>leste</b> seria de Portugal; a <b>oeste</b>, da Espanha. Por isso a chegada de Cabral “cabia” no plano português. Outras nações (como a França) <b>não aceitavam</b> essa divisão.</div>\n<div class=\"box\"><h4>A Carta de Caminha</h4><b>Quem:</b> Pero Vaz de Caminha, escrivão da frota. <b>Para quem:</b> o rei Dom Manuel I. <b>Objetivo:</b> informar o rei sobre a terra e seus habitantes e mostrar que valia a pena ficar com ela. É a nossa principal fonte, mas é a <b>visão de um português</b>, não um relato neutro.</div>\n</div>\n<h3>O primeiro contato e o escambo</h3>\n<p>Caminha descreve indígenas curiosos e encontros pacíficos. Os portugueses davam espelhos, tecidos e outros objetos; os indígenas davam alimentos, plumas e outros produtos. Essa troca direta, <b>sem dinheiro</b>, é o <b>escambo</b>. Atenção: só temos o lado português dessa história. Os indígenas não deixaram registros escritos daquele momento. A visão deles é reconstruída pela <b>arqueologia</b>, pela <b>tradição oral</b> e pela leitura crítica das fontes europeias.</p>\n<h3>Do escambo ao pau-brasil</h3>\n<p>Nos anos seguintes, o interesse foi o <b>pau-brasil</b>, uma árvore que dava um <b>corante vermelho</b> muito valorizado para tingir tecidos na Europa. A Coroa controlava o negócio e o cedia a comerciantes. Os indígenas cortavam e carregavam a madeira até os navios em troca de objetos (escambo). Os portugueses montaram <b>feitorias</b>: entrepostos no litoral para guardar a madeira, e não cidades.</p>\n<div class=\"flow\"><span>Indígenas cortam o pau-brasil</span><i>→</i><span>trocam por objetos (escambo)</span><i>→</i><span>feitoria no litoral guarda a madeira</span><i>→</i><span>navio leva para a Europa</span><i>→</i><span>vira corante</span></div>\n<h3>Por que Portugal demorou a colonizar?</h3>\n<p>Entre 1500 e 1530, o Brasil ficou em segundo plano. O <b>comércio com as Índias dava muito mais lucro</b>. Aqui não se achou ouro nem prata logo no início. O pau-brasil podia ser obtido <b>barato</b>, sem precisar povoar a terra. E Portugal tinha pouca gente para mandar. O problema é que <b>sem ocupar, era difícil defender</b>: navios franceses passaram a vir buscar pau-brasil também. Esse risco é o que vai mudar tudo no capítulo seguinte.</p>\n<div class=\"key\">Resumindo: <b>interesse comercial</b> (Índias) → <b>chegada em 1500</b> → <b>exploração</b> do pau-brasil com escambo → território <b>desprotegido</b> → ameaça francesa → colonização a partir de 1530.</div>\n"}, {"id": "7", "n": "7", "title": "Brasil Colônia: administração colonial", "short": "Administração", "hint": "Capitanias, Governo-Geral e França Antártica", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> para não perder o território, Portugal precisou <b>ocupar</b> o Brasil. Tentou primeiro com dinheiro <b>particular</b> (capitanias) e, como deu errado, passou a <b>governar diretamente</b> (Governo-Geral).</p>\n<h3>Por que a colonização começou em 1530?</h3>\n<p>Os franceses, aliados dos tupinambás, enchiam seus navios de pau-brasil no litoral. Portugal percebeu que o Tratado de Tordesilhas não bastava: era preciso <b>povoar</b>. Em 1530, D. João III enviou <b>Martim Afonso de Sousa</b> para expulsar os franceses, procurar metais (a lenda da “Serra da Prata”) e tomar posse da terra. Ele podia doar terras e nomear funcionários. Em 1532, fundou <b>São Vicente</b>, a primeira vila do Brasil.</p>\n<h3>As capitanias hereditárias (1534)</h3>\n<p>Portugal não tinha dinheiro para colonizar sozinho. A solução foi dividir o território em <b>15 faixas</b>, do litoral até a linha de Tordesilhas, entregues a <b>12 donatários</b> (gente da pequena nobreza, comerciantes e funcionários do rei). A ideia era: <b>o particular paga a colonização</b> e a Coroa recebe parte dos impostos.</p>\n<div class=\"two\">\n<div class=\"box\"><h4>O que o donatário podia fazer</h4>A terra continuava sendo do rei: ele <b>não podia vender nem dividir</b> a capitania, mas a passava aos filhos (por isso “hereditária”). Podia cobrar tributos, fundar vilas, aplicar a justiça, controlar engenhos e <b>doar sesmarias</b>.</div>\n<div class=\"box\"><h4>Sesmarias</h4>Grandes lotes de terra doados a colonos para que fossem cultivados. Foram a origem dos <b>latifúndios</b>: a terra ficou concentrada nas mãos de poucos, uma marca que <b>existe até hoje</b> no Brasil.</div>\n</div>\n<p><b>Por que a maioria fracassou?</b> Faltava dinheiro (muitos faliram), a distância era enorme, a Coroa não ajudava e os indígenas resistiram à ocupação e à escravização. Dos 12 donatários, só 8 vieram ao Brasil. O da Bahia, Francisco Pereira Coutinho, foi morto pelos indígenas. <b>Só duas prosperaram: Pernambuco</b> (Duarte Coelho) e <b>São Vicente</b>, porque conseguiram montar <b>engenhos de açúcar</b>, uma atividade que dava lucro.</p>\n<h3>O Governo-Geral (1549)</h3>\n<p>Com o fracasso das capitanias, a Coroa criou um governo <b>centralizado</b>, ligado direto ao rei, para coordenar, defender e cobrar impostos. As capitanias <b>não acabaram</b> de uma vez: ficaram <b>abaixo</b> do governador-geral.</p>\n<div class=\"vs\"><div><h4>Capitanias hereditárias (1534)</h4><ul><li>Poder <b>dividido</b> entre donatários</li><li>Colonização paga por <b>particulares</b></li><li>Pouco controle do rei</li><li>Resultado: maioria fracassou</li></ul></div><div class=\"x\">×</div><div><h4>Governo-Geral (1549)</h4><ul><li>Poder <b>centralizado</b> no governador</li><li>Coroa participa e investe</li><li>Controle direto do rei</li><li>Objetivo: defender, organizar, cobrar</li></ul></div></div>\n<div class=\"three\"><div><b>Provedor-mor</b>cuidava dos tributos (dinheiro)</div><div><b>Ouvidor-mor</b>cuidava da justiça</div><div><b>Capitão-mor</b>vigiava e defendia a costa</div></div>\n<div class=\"two\">\n<div class=\"box\"><h4>Os 3 primeiros governadores</h4><b>Tomé de Sousa (1549–1553):</b> fundou <b>Salvador</b>, a primeira capital, e trouxe os jesuítas de Manuel da Nóbrega. <b>Duarte da Costa (1553–1558):</b> os conflitos com os indígenas aumentaram. <b>Mem de Sá (1558–1572):</b> combateu os indígenas rebeldes e <b>expulsou os franceses</b>.</div>\n<div class=\"box\"><h4>Salvador (1549)</h4>No alto de uma falésia na Baía de Todos os Santos: boa para <b>defesa</b> e <b>comércio</b>. Cidade Alta (governo, igreja) e Cidade Baixa (porto). Era o <b>centro administrativo</b> da colônia.</div>\n</div>\n<h3>A França Antártica e o Rio de Janeiro</h3>\n<p>Em 1555, os franceses de <b>Villegagnon</b> fundaram a <b>França Antártica</b> na Baía de Guanabara, com o <b>apoio dos tamoios</b>. Mem de Sá atacou em 1560. Os jesuítas <b>Nóbrega e Anchieta</b> negociaram com os tamoios, que deixaram de apoiar os franceses. Em <b>1565</b>, <b>Estácio de Sá</b> fundou o <b>Rio de Janeiro</b> como base militar, e em <b>1567</b> os franceses foram expulsos de vez.</p>\n"}, {"id": "8", "n": "8", "title": "Brasil Colônia: economia colonial", "short": "Economia", "hint": "Açúcar, plantation, engenho e Holanda", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> o <b>açúcar</b> deu lucro à colônia. Para produzi-lo em grande escala, criou-se um sistema de <b>latifúndio + monocultura + trabalho escravizado + exportação</b> que moldou toda a sociedade.</p>\n<h3>Por que o açúcar?</h3>\n<p>Na metade do século XVI, as especiarias davam menos lucro e a Coroa voltou os olhos para o Brasil. Era preciso um produto que <b>valesse muito na Europa</b> para pagar as viagens. O açúcar era caro e cada vez mais consumido. Além disso, os portugueses <b>já tinham experiência</b>: produziam açúcar nas ilhas da Madeira, dos Açores, de Cabo Verde e de São Tomé.</p>\n<h3>Por que no Nordeste, principalmente em Pernambuco?</h3>\n<div class=\"chips\"><span><b>Solo massapê</b>: argiloso e fértil, ótimo para a cana</span><span><b>Clima</b> quente e úmido</span><span><b>Rios</b> para mover moendas e transportar</span><span><b>Mais perto da Europa</b> e de Salvador</span></div>\n<p>Resultado: Pernambuco passou de <b>4 engenhos</b> (por volta de 1540) para cerca de <b>140</b> na metade do século XVII.</p>\n<h3>O sistema de <i>plantation</i></h3>\n<div class=\"flow\"><span><b>Latifúndio</b><br>terras enormes</span><i>→</i><span><b>Monocultura</b><br>só cana</span><i>→</i><span><b>Mão de obra escravizada</b></span><i>→</i><span><b>Exportação</b><br>para a Europa</span></div>\n<p>No começo, os colonos escravizaram <b>indígenas</b>, inclusive com a desculpa da “guerra justa”. Do fim do século XVI em diante, cresceu o uso de <b>africanos escravizados</b>, porque: o <b>tráfico</b> dava muito lucro à Coroa e aos comerciantes; alguns povos africanos <b>já conheciam</b> o cultivo da cana; os indígenas conheciam o território e <b>fugiam</b> com mais facilidade; e a <b>Igreja</b> se opunha menos à escravização de africanos.</p>\n<h3>A aliança Portugal–Holanda</h3>\n<p>Portugal produzia, mas <b>não tinha navios e dinheiro suficientes</b> para transportar e vender todo o açúcar. Os <b>holandeses</b> tinham uma grande frota e um sistema comercial forte. Então os dois se associaram:</p>\n<div class=\"three\"><div><b>Financiavam</b>emprestavam dinheiro para montar engenhos</div><div><b>Transportavam e refinavam</b>levavam o açúcar e o refinavam na Europa</div><div><b>Distribuíam</b>vendiam o açúcar por toda a Europa</div></div>\n<p>Por isso <b>boa parte do lucro ficava com os holandeses</b>. Guarde isso: essa parceria explica por que, depois, eles quiseram o Nordeste para si (capítulo 4).</p>\n<h3>Como era um engenho</h3>\n<div class=\"eng\"><div><b>Casa-grande</b>casa do senhor de engenho e da família: centro do poder</div><div><b>Senzala</b>moradia das pessoas escravizadas</div><div><b>Moenda</b>onde a cana era moída para tirar o caldo</div><div><b>Casa das caldeiras</b>onde o caldo era cozido até virar melaço/açúcar</div><div><b>Capela</b>missas, batizados e enterros da família do senhor</div><div><b>Canaviais</b>a cana precisava ser moída até 24 h após o corte</div></div>\n<p>Havia ainda <b>trabalhadores livres</b> (feitor, mestre do açúcar) e <b>lavradores</b> que plantavam cana em terra arrendada e pagavam ao senhor pelo uso do engenho. Em volta surgiram a <b>pecuária</b> (gado para mover moendas) e o <b>tabaco</b>, usado como moeda no tráfico.</p>\n<div class=\"key\">Conexão: a economia (açúcar para exportar) <b>exigia</b> muita terra e muito trabalho forçado → isso criou uma sociedade com um <b>senhor de engenho poderoso no topo</b> e a maioria <b>escravizada na base</b>. Economia, escravidão e sociedade estão ligadas.</div>\n"}, {"id": "1", "n": "1", "title": "O continente africano e o comércio atlântico", "short": "África", "hint": "Mali, Congo, griôs e comércio atlântico", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> a África <b>não começa</b> com a escravidão. Antes dos europeus, já havia impérios ricos, reinos organizados, cidades de estudo e uma forte tradição de conhecimento.</p>\n<h3>Uma África de sociedades complexas</h3>\n<p>É comum imaginar a África antiga como um lugar “sem história”. Isso é um <b>estereótipo</b>. O continente tinha <b>Estados organizados</b>, com reis e funcionários; <b>redes de comércio</b> que cruzavam o deserto do Saara (ouro, sal, tecidos); cidades; religiões variadas; e muita diversidade de línguas e culturas. Conhecer isso evita reduzir a história africana a uma “história única” de sofrimento.</p>\n<h3>O Império do Mali</h3>\n<p>Na <b>África Ocidental</b>, o Mali viveu seu auge no <b>século XIV</b>. Sua riqueza vinha do <b>controle das rotas do ouro</b>. O governante mais famoso foi <b>Mansa Musa</b>, considerado um dos homens mais ricos da história. Em sua peregrinação a Meca, em 1324, distribuiu tanto ouro que, segundo relatos, o preço do metal <b>caiu</b> no Cairo.</p>\n<div class=\"two\">\n<div class=\"box\"><h4>Tombuctu</h4>Cidade do Mali que era um grande centro de <b>comércio</b> e de <b>estudo</b>, com produção de <b>manuscritos</b> que existem até hoje. Mostra que a África também tinha escrita, saber e escolas.</div>\n<div class=\"box\"><h4>Reino do Congo</h4>Na <b>África Central</b>, tinha um rei, o <b>manicongo</b>, e uma administração própria. No fim do século XV, fez <b>relações diplomáticas</b> com Portugal e chegou a enviar <b>embaixadores</b> à corte portuguesa: uma relação entre governos.</div>\n</div>\n<h3>Os griôs e a tradição oral</h3>\n<p>Em muitas sociedades da África Ocidental, os <b>griôs</b> eram “guardiões da memória”. Eles decoravam e contavam, de geração em geração, a <b>história, as genealogias</b> (quem descende de quem) e os <b>valores</b> do povo. Hoje, essa <b>tradição oral</b> é aceita como <b>fonte histórica</b>, ao lado dos documentos escritos. Pense nela como uma biblioteca viva.</p>\n<h3>Como sabemos disso?</h3>\n<p>Pelos <b>manuscritos de Tombuctu</b>, pelos relatos de <b>viajantes árabes</b> que visitaram o Mali, pelos <b>registros diplomáticos</b> entre Congo e Portugal e pela tradição oral dos griôs.</p>\n<h3>O comércio atlântico: de parceria a tráfico</h3>\n<p>Quando os portugueses chegaram à costa africana no século XV, as primeiras trocas envolviam <b>ouro, marfim</b> e outros produtos, em relações com <b>certo equilíbrio</b>: os reinos africanos negociavam com força. Com o tempo, e principalmente com a <b>colonização da América</b>, que precisava de muita mão de obra para o açúcar, o <b>comércio de pessoas escravizadas</b> passou a dominar tudo. Isso transformou profundamente as relações entre africanos e europeus e as próprias sociedades africanas.</p>\n<div class=\"flow\"><span>Trocas de ouro e marfim<br><small>(certo equilíbrio)</small></span><i>→</i><span>Colonização da América<br><small>precisa de mão de obra</small></span><i>→</i><span>Tráfico de pessoas escravizadas domina</span><i>→</i><span>Relações transformadas<br><small>violência e desigualdade</small></span></div>\n<div class=\"key\">Ponte para os próximos capítulos: o mesmo <b>açúcar</b> do capítulo 8 é o que faz o tráfico crescer. Os povos trazidos ao Brasil vinham dessas sociedades complexas, com <b>culturas próprias</b>, e é isso que vão preservar e usar para resistir (capítulo 2).</div>\n<div class=\"box q\"><h4>Para pensar (pode cair em dissertativa)</h4>Por que é importante estudar a África <b>antes</b> do tráfico? Porque reconhecer a riqueza e a organização dessas sociedades é uma forma de <b>justiça histórica</b> e rompe com a ideia de que a história africana é só de vítimas.</div>\n"}, {"id": "2", "n": "2", "title": "Africanos no Brasil: cultura, resistência e escravidão", "short": "Africanos no Brasil", "hint": "Escravidão, sincretismo e Palmares", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> a escravidão foi extremamente violenta, mas os africanos <b>não foram só vítimas</b>: preservaram suas culturas, criaram comunidades e resistiram de muitas formas.</p>\n<h3>Como funcionava a escravidão colonial</h3>\n<p>Pessoas eram capturadas na África, atravessavam o Atlântico em <b>navios negreiros</b> e eram vendidas como mercadoria. No Brasil, trabalhavam nos engenhos, nas casas, nas cidades e, mais tarde, nas minas. Não tinham direitos reconhecidos e eram consideradas <b>propriedade</b> de seus senhores.</p>\n<div class=\"three\"><div><b>Violência física</b>castigos e trabalho exaustivo</div><div><b>Violência simbólica</b>desumanização; tentativa de apagar nomes, línguas e culturas</div><div><b>Violência psicológica</b>separação forçada de famílias e comunidades</div></div>\n<h3>Quem eram os africanos trazidos ao Brasil</h3>\n<p>Não existia “um povo africano”. Vieram povos muito diferentes, cada um com <b>língua, religião e costumes próprios</b>:</p>\n<div class=\"two\">\n<div class=\"box\"><h4>Bantos</h4>Da região de <b>Angola e Congo</b> (África Central e do Sul).</div>\n<div class=\"box\"><h4>Iorubás e fons</h4>Da <b>Costa da Mina</b>, na África Ocidental.</div>\n</div>\n<p>Os <b>registros dos navios negreiros</b> ajudam os historiadores a descobrir de onde vinha cada grupo.</p>\n<h3>Sincretismo religioso: disfarce e resistência</h3>\n<p>As pessoas escravizadas eram obrigadas a seguir o catolicismo e <b>proibidas</b> de praticar abertamente suas religiões. Então passaram a <b>associar orixás e outras divindades africanas a santos católicos</b>. Por fora, parecia devoção católica; por dentro, a fé africana continuava viva. Isso é o <b>sincretismo</b>. Ele pode ser visto de dois jeitos ao mesmo tempo: como resultado de uma <b>imposição</b> e como uma <b>estratégia de resistência</b> para preservar a cultura.</p>\n<h3>Formas de resistência</h3>\n<div class=\"chips\"><span>Preservar <b>religião, música, dança e língua</b></span><span><b>Fugas</b></span><span>Formar <b>quilombos</b></span><span>Revoltas e enfrentamento</span></div>\n<h3>Quilombos e Palmares</h3>\n<p><b>Quilombos</b> eram comunidades formadas por pessoas que fugiram da escravidão em busca de liberdade. Lá plantavam, criavam regras próprias e se defendiam. O maior das Américas foi o <b>Quilombo dos Palmares</b>, na <b>Serra da Barriga</b>, atual <b>Alagoas</b>. Resistiu por <b>quase um século</b> e chegou a ter <b>20 a 30 mil pessoas</b>, mais do que muitas cidades coloniais. Foi destruído em <b>1694</b> por tropas a serviço dos colonos. Seu líder mais conhecido, <b>Zumbi</b>, foi morto em 20 de novembro de 1695 e virou <b>símbolo da resistência negra</b> (hoje é o Dia da Consciência Negra). Escavações arqueológicas na Serra da Barriga ajudam a entender como Palmares se organizava.</p>\n<h3>Uma história que continua</h3>\n<p>Ainda hoje existem <b>comunidades quilombolas</b> que lutam pelo <b>reconhecimento</b> e pelo <b>direito às suas terras</b>. A resistência não ficou no passado: ela conecta a história colonial com os desafios do Brasil atual.</p>\n<div class=\"key\">Ligue os pontos: o <b>açúcar</b> (cap. 8) exigia mão de obra → <b>tráfico</b> de povos africanos (cap. 1) → <b>escravidão</b> violenta → <b>resistência</b> cultural e física (quilombos, sincretismo) → <b>quilombolas</b> hoje.</div>\n"}, {"id": "3", "n": "3", "title": "Brasil Colônia: sociedade colonial", "short": "Sociedade", "hint": "Cidades, jesuítas e pirâmide social", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> a sociedade colonial concentrava <b>terra, riqueza e poder</b> em poucas mãos. Muitas desigualdades do Brasil de hoje vêm daí.</p>\n<h3>As primeiras cidades</h3>\n<p>As primeiras vilas e cidades, como <b>São Vicente (1532)</b> e <b>Salvador (1549)</b>, não surgiram por acaso. Eram <b>pontos estratégicos</b> para controlar o território e o comércio. Concentravam o pouco que a colônia tinha de <b>administração</b> (governo, Câmara), <b>defesa</b> (fortes, soldados) e <b>religião</b> (igrejas, colégios). A maior parte da população, porém, vivia no <b>campo</b>, ao redor dos engenhos: era ali que estava o poder econômico.</p>\n<h3>A Companhia de Jesus (os jesuítas)</h3>\n<p>Os jesuítas chegaram em 1549 com Tomé de Sousa, liderados por <b>Manuel da Nóbrega</b>, e tiveram papel enorme:</p>\n<div class=\"three\"><div><b>Catequese</b>ensinavam a fé católica aos indígenas, muitas vezes reunindo-os em aldeamentos</div><div><b>Educação</b>fundaram os primeiros colégios e dominaram o ensino formal por muito tempo</div><div><b>Cidades</b>o Colégio de São Paulo de Piratininga (1554) deu origem à cidade de São Paulo</div></div>\n<p>Repare na contradição: os jesuítas defendiam os indígenas da escravização, mas a catequese também <b>mudava os costumes e as crenças</b> indígenas para encaixá-los no mundo português. Lembre ainda que Nóbrega e Anchieta ajudaram a negociar com os tamoios contra os franceses (capítulo 7).</p>\n<h3>Uma sociedade em pirâmide</h3>\n<div class=\"pyr\">\n<div class=\"p1\"><b>Grandes proprietários</b> (senhores de engenho): donos de terra e de pessoas escravizadas; controlavam a economia e a política local</div>\n<div class=\"p2\"><b>Homens livres pobres</b>: lavradores, artesãos, pequenos comerciantes, agregados; livres, mas com pouca terra e pouco poder</div>\n<div class=\"p3\"><b>Pessoas escravizadas</b>: a maioria da força de trabalho, sem direitos reconhecidos</div>\n</div>\n<p>Era uma hierarquia <b>rígida</b>: quase não dava para subir. Quem nascia escravizado ou pobre dificilmente mudava de lugar. Por que tão desigual? Porque a economia colonial (capítulo 8) se baseava no <b>latifúndio</b> (as sesmarias deixaram a terra com poucos) e no <b>trabalho escravizado</b>. Quem tinha terra tinha engenho; quem tinha engenho tinha poder.</p>\n<h3>Permanências: o passado no presente</h3>\n<p>Uma <b>permanência histórica</b> é algo do passado que continua existindo hoje. Muitas desigualdades atuais têm raízes coloniais:</p>\n<div class=\"two\">\n<div class=\"box\"><h4>Ontem (colônia)</h4><ul><li>Terra concentrada em <b>latifúndios</b></li><li>Riqueza nas mãos dos senhores</li><li>Poder político local dos grandes proprietários</li><li>Escravidão e exclusão da população negra e indígena</li></ul></div>\n<div class=\"box\"><h4>Hoje</h4><ul><li><b>Concentração de terras</b> e conflitos no campo</li><li><b>Desigualdade de renda</b> muito alta</li><li>Pouca <b>representação política</b> dos mais pobres</li><li><b>Desigualdade racial</b> em renda, educação e trabalho</li></ul></div>\n</div>\n<div class=\"key\">Pergunta-chave da matéria: <b>“de onde vem essa desigualdade?”</b> Ao olhar a sociedade colonial, entendemos que muitas diferenças de hoje não são “naturais”: elas foram <b>construídas</b> historicamente.</div>\n"}, {"id": "4", "n": "4", "title": "Brasil Colônia: União Ibérica e invasão holandesa", "short": "União Ibérica", "hint": "Holandeses, Nassau e Restauração", "html": "\n<p class=\"ideia\"><b>Ideia central:</b> holandeses e portugueses eram <b>sócios</b> no açúcar. A união de Portugal com a <b>Espanha</b>, inimiga da Holanda, transformou os sócios em <b>inimigos</b>.</p>\n<h3>A crise sucessória e a União Ibérica (1580–1640)</h3>\n<p>Em <b>1578</b>, o jovem rei português <b>Dom Sebastião</b> morreu numa batalha no Marrocos (Alcácer-Quibir) <b>sem deixar filhos</b>. Portugal ficou sem herdeiro direto. O rei da Espanha, <b>Filipe II</b>, era parente da família real portuguesa e assumiu o trono em <b>1580</b>. Começou a <b>União Ibérica</b>: Portugal e Espanha passaram a ter <b>o mesmo rei</b>. Portugal não “virou Espanha”, mas os <b>inimigos da Espanha</b> passaram a ser inimigos de Portugal também. Na prática, a linha de Tordesilhas perdeu importância nesse período.</p>\n<h3>Por que os holandeses atacaram?</h3>\n<p>A Holanda lutava pela sua <b>independência contra a Espanha</b>. Com Portugal unido à Espanha, as colônias portuguesas viraram <b>alvos</b>. O rei espanhol ainda proibiu os holandeses de negociar nos portos portugueses, o que cortou o negócio do açúcar. Os holandeses tinham dois motivos:</p>\n<div class=\"two\">\n<div class=\"box\"><h4>Motivo político</h4>Atingir a Espanha, sua inimiga, atacando as terras que ela agora controlava.</div>\n<div class=\"box\"><h4>Motivo econômico</h4>Recuperar o lucro do açúcar. Eles <b>já conheciam</b> o negócio, porque financiavam, transportavam e distribuíam o açúcar nordestino.</div>\n</div>\n<div class=\"vs\"><div><h4>Antes: aliança comercial</h4><ul><li>Portugal produz o açúcar</li><li>Holanda financia, transporta, refina e vende</li><li>Os dois lucram: são sócios</li></ul></div><div class=\"x\">×</div><div><h4>Depois: invasão holandesa</h4><ul><li>União Ibérica junta Portugal à Espanha</li><li>Holanda perde acesso ao açúcar</li><li>Decide <b>tomar a fonte</b>: o Nordeste</li></ul></div></div>\n<h3>As invasões</h3>\n<p>Em <b>1624</b>, os holandeses tomaram <b>Salvador</b>, a capital, mas foram expulsos no ano seguinte. Em <b>1630</b>, invadiram <b>Pernambuco</b>, a maior região produtora de açúcar, e ficaram por mais de <b>20 anos</b>.</p>\n<h3>O governo de Maurício de Nassau (1637–1644)</h3>\n<div class=\"chips\"><span><b>Tolerância religiosa</b>: liberdade de culto para judeus e protestantes</span><span><b>Urbanismo</b>: obras e melhorias no Recife</span><span><b>Ciência e arte</b>: trouxe pintores como Frans Post e Albert Eckhout</span><span>Acordos com os senhores de engenho para <b>retomar a produção</b></span></div>\n<p>As pinturas de Post e Eckhout são hoje <b>fontes visuais</b> importantíssimas sobre o Brasil do século XVII. Mas atenção: mesmo com essas melhorias, continuava sendo uma <b>ocupação estrangeira</b> que visava lucro, e mantinha a escravidão.</p>\n<h3>O fim da ocupação</h3>\n<p>Em <b>1640</b>, Portugal se separou da Espanha e voltou a ter um rei português: a <b>Restauração</b>. Isso <b>não expulsou</b> os holandeses automaticamente: eles continuaram em Pernambuco. Depois que Nassau saiu (1644), a Companhia holandesa passou a cobrar as dívidas dos senhores de engenho com dureza. Os colonos, então, se revoltaram na <b>Insurreição Pernambucana</b> (1645), que expulsou os holandeses de vez em <b>1654</b>.</p>\n<div class=\"tl\"><div><b>1578</b><span>Morre D. Sebastião</span></div><div><b>1580</b><span>Começa a União Ibérica</span></div><div><b>1624</b><span>Invasão da Bahia</span></div><div><b>1630</b><span>Invasão de Pernambuco</span></div><div><b>1637</b><span>Nassau assume</span></div><div><b>1640</b><span>Restauração</span></div><div><b>1654</b><span>Holandeses expulsos</span></div></div>\n<div class=\"key\">Consequência: expulsos, os holandeses levaram o que aprenderam e passaram a produzir açúcar nas <b>Antilhas</b>, fazendo concorrência ao açúcar brasileiro.</div>\n"}], "extras": [{"id": "revisao", "title": "Revisão geral para a prova", "html": "\n<div class=\"sgrid\">\n<div class=\"sb\"><h4>Os 7 capítulos em uma frase</h4><ul class=\"tight\">\n<li><b>6 Pré-colonial:</b> Portugal chega (1500) por interesse comercial e só explora o pau-brasil com escambo.</li>\n<li><b>7 Administração:</b> para não perder a terra, ocupa: capitanias (particular) → Governo-Geral (centralizado).</li>\n<li><b>8 Economia:</b> açúcar no Nordeste = latifúndio + monocultura + escravidão + exportação, com aliança holandesa.</li>\n<li><b>1 África:</b> sociedades complexas (Mali, Congo, griôs) antes do tráfico dominar as relações.</li>\n<li><b>2 Africanos no Brasil:</b> escravidão violenta, mas com resistência: sincretismo, quilombos, Palmares.</li>\n<li><b>3 Sociedade:</b> pirâmide rígida e desigual, com jesuítas na educação; raízes da desigualdade atual.</li>\n<li><b>4 União Ibérica:</b> Portugal + Espanha → Holanda deixa de ser sócia e invade Pernambuco.</li></ul></div>\n<div class=\"sb\"><h4>Linha do tempo</h4><div class=\"tl\"><div><b>1494</b><span>Tordesilhas</span></div><div><b>1500</b><span>Cabral chega</span></div><div><b>1532</b><span>São Vicente</span></div><div><b>1534</b><span>Capitanias</span></div><div><b>1549</b><span>Governo-Geral e Salvador</span></div><div><b>1555</b><span>França Antártica</span></div><div><b>1565</b><span>Rio de Janeiro</span></div><div><b>1580</b><span>União Ibérica</span></div><div><b>1630</b><span>Holandeses em PE</span></div><div><b>1640</b><span>Restauração</span></div><div><b>1654</b><span>Expulsão holandesa</span></div><div><b>1694</b><span>Fim de Palmares</span></div></div></div>\n</div>\n<h4 class=\"sh\">Não confunda</h4>\n<div class=\"cmp\">\n<div><b>Capitanias × Governo-Geral</b>poder dividido e pago por particulares × poder centralizado ligado ao rei</div>\n<div><b>Escambo × escravidão</b>troca de objetos pelo trabalho indígena × pessoa tratada como propriedade e forçada a trabalhar</div>\n<div><b>Resistência × independência</b>quilombos e sincretismo buscavam <b>liberdade e dignidade</b>, não separar o Brasil de Portugal</div>\n<div><b>Sociedade colonial × hoje</b>latifúndio e escravidão → concentração de terra, renda e desigualdade racial atuais</div>\n<div><b>União Ibérica × Restauração</b>1580: mesmo rei para Portugal e Espanha × 1640: Portugal volta a ter rei próprio</div>\n<div><b>Aliança × invasão holandesa</b>sócios no açúcar × inimigos depois que Portugal se uniu à Espanha</div>\n</div>\n<div class=\"sgrid\">\n<div class=\"sb\"><h4>Causa → consequência</h4><ul class=\"tight\">\n<li>Franceses no litoral → início da colonização (1530)</li>\n<li>Falta de dinheiro e resistência indígena → fracasso das capitanias → Governo-Geral</li>\n<li>Sesmarias → latifúndio → terra concentrada até hoje</li>\n<li>Açúcar exige muito trabalho → tráfico de africanos cresce</li>\n<li>Proibição da fé africana → sincretismo</li>\n<li>União Ibérica → Holanda perde o açúcar → invade Pernambuco</li></ul></div>\n<div class=\"sb\"><h4>Quem é quem</h4><ul class=\"tight\">\n<li><b>Cabral:</b> chega ao Brasil em 1500</li><li><b>Caminha:</b> escreve a carta ao rei D. Manuel</li>\n<li><b>Martim Afonso:</b> funda São Vicente (1532)</li><li><b>Duarte Coelho:</b> capitania de Pernambuco</li>\n<li><b>Tomé de Sousa:</b> 1º governador; funda Salvador</li><li><b>Mem de Sá:</b> expulsa os franceses</li>\n<li><b>Estácio de Sá:</b> funda o Rio (1565)</li><li><b>Villegagnon:</b> França Antártica</li>\n<li><b>Nóbrega e Anchieta:</b> jesuítas; paz com os tamoios</li><li><b>Mansa Musa:</b> rei do Mali; ouro</li>\n<li><b>Manicongo:</b> rei do Congo</li><li><b>Zumbi:</b> líder de Palmares</li>\n<li><b>D. Sebastião:</b> morre e abre a crise</li><li><b>Nassau:</b> governa o Brasil holandês</li></ul></div>\n</div>\n<div class=\"final\"><h4>Se eu entender estas ideias, entendi a matéria</h4><ol>\n<li>Portugal veio pelo <b>lucro</b> e só colonizou quando teve <b>medo de perder</b> a terra.</li>\n<li>As capitanias falharam por falta de <b>dinheiro e apoio</b>; o Governo-Geral <b>centralizou</b> o poder.</li>\n<li>O <b>açúcar</b> organizou tudo: a terra, o trabalho e a sociedade.</li>\n<li>A África tinha <b>reinos e saberes</b> antes do tráfico.</li>\n<li>Os africanos escravizados <b>resistiram</b>: cultura, fé, fugas e quilombos.</li>\n<li>A sociedade colonial era uma <b>pirâmide desigual</b>, e isso ainda pesa hoje.</li>\n<li>Sócios viraram inimigos porque <b>Portugal se uniu à Espanha</b>.</li></ol></div>\n"}], "extraTabs": [["revisao", "Revisão geral"]], "plan": ["Ler a <b>Revisão geral</b> (linha do tempo e “Não confunda”) — 10 min", "Ler os capítulos <b>7 e 8</b> (administração e economia) — os mais longos", "Ler os capítulos <b>6, 1, 2, 3 e 4</b> no modo “Só o essencial”", "Fazer um <b>simulado de 20</b> questões", "Refazer as que errou e rever os <b>flashcards</b>", "Escrever pelo menos <b>1 dissertativa</b> e comparar com a resposta"], "quiz": [{"id": "h0", "c": "6", "d": 1, "q": "Nas primeiras décadas após 1500, Portugal não ocupou o território de forma efetiva. Os portugueses instalavam feitorias no litoral e dependiam do trabalho dos indígenas, que cortavam e carregavam as toras de pau-brasil até os navios. Em troca, recebiam objetos como facas, machados, espelhos e tecidos. Essa forma de troca, em que não havia uso de moeda, é conhecida como:", "a": ["sesmaria", "escambo", "plantation", "feitoria", "capitania"], "k": 1, "e": "Escambo é a troca direta de objetos por produtos ou trabalho, sem dinheiro."}, {"id": "h1", "c": "2", "d": 1, "q": "Durante o século XVII, milhares de pessoas que fugiam da escravidão nos engenhos do Nordeste se reuniram em uma comunidade que resistiu por quase cem anos a diversas expedições militares. Ali plantavam, criavam regras próprias e se defendiam. O Quilombo dos Palmares, considerado o maior das Américas e liderado por Zumbi em seus últimos anos, ficava na Serra da Barriga, no atual estado de:", "a": ["Bahia", "Pernambuco", "Alagoas", "Rio de Janeiro", "São Paulo"], "k": 2, "e": "Palmares ficava em Alagoas e foi destruído em 1694; Zumbi é seu líder mais conhecido."}, {"id": "h2", "c": "1", "d": 2, "q": "Em 1324, o governante Mansa Musa fez uma peregrinação a Meca e distribuiu tanto ouro pelo caminho que o preço do metal caiu no Cairo. Na mesma época, a cidade de Tombuctu reunia comerciantes e estudiosos e produzia manuscritos, enquanto, em várias sociedades da África Ocidental, os griôs transmitiam oralmente a história e as genealogias de seu povo. Esses exemplos são usados pelos historiadores para mostrar que, antes da chegada dos europeus, a África:", "a": ["vivia isolada, sem contato com outros povos", "já tinha sociedades organizadas, ricas e com produção de conhecimento", "só passou a ter comércio com a chegada dos portugueses", "não possuía nenhuma forma de registro da sua história", "era dominada pelo Reino de Portugal"], "k": 1, "e": "A ideia central do capítulo: a África tinha Estados, comércio, saber escrito e tradição oral antes do tráfico."}, {"id": "h3", "c": "7", "d": 2, "q": "Em 1534, D. João III dividiu o território em capitanias hereditárias, entregues a donatários que deveriam colonizar a terra com seus próprios recursos. Quinze anos depois, em 1549, a Coroa enviou Tomé de Sousa como primeiro governador-geral, acompanhado de funcionários, soldados e jesuítas, e fundou Salvador como sede da administração. Considerando esse contexto, qual alternativa explica corretamente por que a Coroa criou o Governo-Geral?", "a": ["As capitanias deram tanto lucro que precisavam ser divididas", "A maioria das capitanias fracassou, e era preciso centralizar o poder para defender e organizar a colônia", "Os holandeses exigiram um governo único no Brasil", "Os jesuítas queriam governar a colônia sozinhos", "Portugal queria acabar com a produção de açúcar"], "k": 1, "e": "Falta de recursos, ataques indígenas e pouco apoio da Coroa fizeram a maioria das capitanias falhar; o Governo-Geral centralizou o poder."}, {"id": "h4", "c": "8", "d": 2, "q": "Segundo o livro, Pernambuco tinha apenas 4 engenhos entre 1535 e 1550, mas chegou a cerca de 140 na metade do século XVII, tornando-se o principal núcleo produtor de açúcar da colônia. Esse crescimento está ligado a um conjunto de condições naturais e geográficas da região, além dos interesses mercantis da Coroa portuguesa. Entre os fatores que explicam esse sucesso, NÃO está:", "a": ["o solo massapê, fértil e argiloso", "o clima quente e úmido", "os rios que ajudavam a mover moendas e transportar", "a grande quantidade de minas de ouro na região", "a menor distância em relação à Europa"], "k": 3, "e": "Não havia minas de ouro em Pernambuco; o sucesso veio do solo, clima, rios e localização."}, {"id": "h5", "c": "3", "d": 2, "q": "A sociedade colonial brasileira costuma ser representada como uma pirâmide. No topo estavam os grandes proprietários de terras e de pessoas escravizadas; na base, a população escravizada, sem direitos reconhecidos. Entre esses dois extremos havia um grupo numeroso, formado por lavradores, artesãos, pequenos comerciantes e agregados, que tinha dificuldade de subir nessa hierarquia rígida. Esse grupo intermediário, chamado de homens livres pobres, era composto por:", "a": ["os donos dos maiores engenhos", "pessoas livres, mas com pouca terra, pouco dinheiro e pouco poder", "os padres jesuítas que dirigiam os colégios", "as pessoas escravizadas que trabalhavam nas casas", "os governadores-gerais enviados pelo rei"], "k": 1, "e": "Ficavam no meio da pirâmide: livres, mas à margem do poder (lavradores, artesãos, agregados)."}, {"id": "h6", "c": "4", "d": 3, "q": "Durante o século XVI, os holandeses financiavam engenhos, transportavam, refinavam e distribuíam o açúcar produzido no Brasil, em uma parceria lucrativa com os portugueses. Ainda assim, depois de uma tentativa frustrada na Bahia em 1624, os holandeses invadiram Pernambuco em 1630 e ali permaneceram por mais de duas décadas. A melhor explicação para essa aparente contradição é que:", "a": ["Portugal deixou de produzir açúcar depois de 1580", "com a União Ibérica, Portugal passou a ter o mesmo rei da Espanha, inimiga da Holanda, e os holandeses perderam acesso ao açúcar", "os holandeses queriam espalhar o catolicismo no Brasil", "Maurício de Nassau era português e traiu a Holanda", "a Restauração de 1640 obrigou os holandeses a atacar"], "k": 1, "e": "Motivo político (atacar a Espanha) + econômico (recuperar o lucro do açúcar que já conheciam)."}, {"id": "h7", "c": "2", "d": 3, "q": "No Brasil colonial, africanos de diferentes povos, como bantos, iorubás e fons, foram obrigados a seguir o catolicismo e impedidos de praticar abertamente suas religiões. Com o tempo, passaram a associar orixás e outras divindades africanas a santos católicos, mantendo rituais e crenças sob uma aparência cristã. Sobre esse processo, chamado de sincretismo religioso, é correto afirmar que ele:", "a": ["foi apenas uma conversão completa dos africanos ao catolicismo", "mostra que os africanos abandonaram suas tradições", "pode ser visto ao mesmo tempo como resultado de uma imposição e como estratégia de resistência cultural", "foi criado pelos jesuítas para ensinar os indígenas", "só existiu depois do fim da escravidão"], "k": 2, "e": "Associar orixás a santos católicos foi uma forma de preservar a fé africana disfarçada, dentro de uma imposição."}, {"id": "h8", "c": "6", "d": 3, "q": "A Carta de Pero Vaz de Caminha, escrita em 1500 para o rei D. Manuel I, é considerada a “certidão de nascimento” do Brasil na documentação histórica. Ela descreve a terra, os indígenas e os primeiros contatos, e é praticamente o único registro escrito daquele momento, já que os povos indígenas não deixaram documentos escritos sobre o encontro. Um historiador que vai usar essa carta como fonte deve:", "a": ["considerá-la um relato neutro, pois foi escrita por uma testemunha", "descartá-la, porque toda fonte escrita é falsa", "lê-la criticamente, lembrando que foi escrita por um português, para o rei, com o objetivo de mostrar o valor da terra", "usá-la para conhecer a visão dos indígenas sobre o encontro", "compará-la apenas com outras cartas de indígenas da época"], "k": 2, "e": "Pergunte sempre: quem escreveu, para quem e com qual objetivo. Não existem registros escritos indígenas daquele momento."}, {"id": "h9", "c": "7", "d": 3, "q": "Ao receber uma capitania, o donatário ganhava amplos poderes: podia fundar vilas, cobrar tributos, aplicar a justiça e controlar a instalação de engenhos. Também podia conceder sesmarias, palavra de origem latina que se referia a grandes porções de terra entregues a colonos para que fossem cultivadas. Muitos historiadores relacionam essas doações a características da estrutura fundiária brasileira atual. Sobre esse sistema, assinale a alternativa correta:", "a": ["O donatário era dono da capitania e podia vendê-la", "As sesmarias eram pequenos lotes doados aos indígenas", "O donatário não era dono da terra, mas podia doar sesmarias, o que ajudou a formar os latifúndios", "As capitanias foram extintas no mesmo dia em que o Governo-Geral foi criado", "Todas as capitanias prosperaram graças ao pau-brasil"], "k": 2, "e": "A terra continuava sendo do rei; as sesmarias (grandes lotes) deram origem à concentração de terras que persiste hoje."}, {"id": "h10", "c": "6", "d": 1, "q": "O Tratado de Tordesilhas, assinado em 1494 entre Portugal e Espanha, foi importante para entender a chegada de Cabral porque:", "a": ["proibia Portugal de navegar pelo Atlântico", "já garantia a Portugal terras a leste de uma linha imaginária no Atlântico", "dava à França o direito de explorar o pau-brasil", "dividia a África entre Portugal e Holanda", "criava as capitanias hereditárias"], "k": 1, "e": "A linha de Tordesilhas deixava a leste as terras portuguesas; por isso historiadores desconfiam que Portugal já suspeitava da existência de terras ali."}, {"id": "h11", "c": "6", "d": 2, "q": "Entre 1500 e 1530, Portugal se interessou pouco por ocupar o Brasil. O principal motivo foi que:", "a": ["o comércio com as Índias dava muito mais lucro e aqui não se achou ouro de início", "os indígenas expulsaram todos os portugueses em 1501", "a Espanha proibiu Portugal de voltar ao Brasil", "o pau-brasil não tinha valor na Europa", "os jesuítas já governavam a colônia"], "k": 0, "e": "As especiarias do Oriente eram o grande negócio; o pau-brasil podia ser obtido barato, por escambo, sem povoar."}, {"id": "h12", "c": "6", "d": 2, "q": "As feitorias instaladas no litoral no período pré-colonial eram:", "a": ["grandes cidades com igrejas e colégios", "entrepostos para guardar o pau-brasil até a chegada dos navios", "engenhos de açúcar", "aldeias jesuíticas", "fortes holandeses"], "k": 1, "e": "Feitoria não é cidade: era um depósito/entreposto comercial no litoral."}, {"id": "h13", "c": "7", "d": 1, "q": "A primeira vila fundada no Brasil, em 1532, por Martim Afonso de Sousa, foi:", "a": ["Salvador", "Rio de Janeiro", "São Vicente", "Olinda", "Recife"], "k": 2, "e": "São Vicente (1532). Salvador é de 1549 e o Rio de Janeiro de 1565."}, {"id": "h14", "c": "7", "d": 2, "q": "Sobre as funções criadas no Governo-Geral, a relação correta é:", "a": ["provedor-mor: justiça; ouvidor-mor: tributos", "provedor-mor: tributos; ouvidor-mor: justiça; capitão-mor: defesa da costa", "capitão-mor: catequese dos indígenas", "ouvidor-mor: comércio de escravizados", "provedor-mor: construção de engenhos"], "k": 1, "e": "Provedor = dinheiro (tributos); ouvidor = justiça; capitão = defesa."}, {"id": "h15", "c": "7", "d": 3, "q": "A França Antártica (1555–1567), na Baía de Guanabara, contou com o apoio de um povo indígena e terminou com a fundação de uma cidade portuguesa. Esse povo e essa cidade são, respectivamente:", "a": ["tupiniquins e Salvador", "tamoios e Rio de Janeiro", "potiguaras e Recife", "tamoios e São Vicente", "guaranis e São Paulo"], "k": 1, "e": "Os tamoios apoiaram os franceses; Estácio de Sá fundou o Rio em 1565 e os franceses foram expulsos em 1567."}, {"id": "h16", "c": "7", "d": 2, "q": "Das capitanias hereditárias, apenas duas prosperaram. Isso aconteceu porque:", "a": ["receberam mais ouro da Coroa", "conseguiram montar engenhos de açúcar lucrativos", "eram governadas por jesuítas", "foram ocupadas pelos holandeses", "não tinham população indígena"], "k": 1, "e": "Pernambuco (Duarte Coelho) e São Vicente prosperaram com o açúcar."}, {"id": "h17", "c": "8", "d": 1, "q": "O sistema de plantation do Brasil colonial combinava:", "a": ["pequenas propriedades, policultura e trabalho livre", "latifúndio, monocultura, trabalho escravizado e exportação", "indústria, comércio interno e assalariados", "mineração, cidades e trabalho indígena livre", "feitorias, escambo e pau-brasil"], "k": 1, "e": "Latifúndio + monocultura + escravidão + exportação."}, {"id": "h18", "c": "8", "d": 2, "q": "Na aliança comercial do açúcar, a participação holandesa incluía:", "a": ["plantar a cana e administrar os engenhos", "financiar engenhos, transportar, refinar e distribuir o açúcar na Europa", "fornecer indígenas escravizados", "governar Pernambuco desde 1530", "proibir o tráfico de africanos"], "k": 1, "e": "Portugal produzia; a Holanda financiava, transportava e vendia, ficando com boa parte do lucro."}, {"id": "h19", "c": "8", "d": 3, "q": "Uma pergunta do livro é se a monocultura do açúcar era autossuficiente. A resposta mais adequada é que:", "a": ["sim, pois o engenho produzia tudo de que precisava", "não, pois dependia de atividades de apoio (gado, tabaco, alimentos, madeira) e do comércio externo", "sim, porque não exportava nada", "não, porque os engenhos ficavam nas cidades", "sim, porque usava apenas trabalho livre"], "k": 1, "e": "O complexo do açúcar dependia de pecuária, tabaco (moeda no tráfico), lenha, alimentos e do mercado europeu."}, {"id": "h20", "c": "8", "d": 2, "q": "O uso de africanos escravizados cresceu no final do século XVI. NÃO é um dos motivos apontados pelo livro:", "a": ["o tráfico era muito lucrativo para a Coroa e os comerciantes", "alguns povos africanos já conheciam o cultivo da cana", "os indígenas conheciam o território e fugiam com mais facilidade", "a Igreja se opunha menos à escravização de africanos", "os africanos recebiam salário maior que os indígenas"], "k": 4, "e": "Não havia salário: eram pessoas escravizadas. Os outros quatro motivos estão no livro."}, {"id": "h21", "c": "1", "d": 1, "q": "No Reino do Congo, o título do rei era:", "a": ["mansa", "griô", "manicongo", "faraó", "sultão"], "k": 2, "e": "Manicongo = rei do Congo. Mansa era o título no Mali."}, {"id": "h22", "c": "1", "d": 2, "q": "Os griôs eram importantes nas sociedades da África Ocidental porque:", "a": ["comandavam os navios negreiros", "preservavam pela tradição oral a história, as genealogias e os valores do povo", "escreviam as leis do Império Português", "eram comerciantes de ouro em Lisboa", "governavam o Reino do Congo"], "k": 1, "e": "A tradição oral é reconhecida hoje como fonte histórica."}, {"id": "h23", "c": "1", "d": 3, "q": "As relações entre europeus e africanos mudaram ao longo do tempo. A frase que melhor descreve essa mudança é:", "a": ["sempre foram de dominação total dos europeus", "começaram com trocas de ouro e marfim com certo equilíbrio e passaram a ser dominadas pelo tráfico de pessoas escravizadas", "começaram com o tráfico e terminaram com trocas de ouro", "nunca houve diplomacia entre reinos africanos e europeus", "os africanos não participavam do comércio atlântico"], "k": 1, "e": "Houve inclusive embaixadas do Congo em Portugal; com a colonização da América, o tráfico passou a dominar."}, {"id": "h24", "c": "2", "d": 2, "q": "Os bantos, um dos grupos africanos trazidos ao Brasil, vinham principalmente da região de:", "a": ["Egito e Sudão", "Angola e Congo", "Marrocos", "Costa da Mina (iorubás)", "Madagascar"], "k": 1, "e": "Bantos: Angola e Congo. Iorubás e fons: Costa da Mina."}, {"id": "h25", "c": "2", "d": 2, "q": "Separar famílias e comunidades e tentar apagar nomes e culturas de origem são exemplos, respectivamente, de violência:", "a": ["física e econômica", "psicológica e simbólica", "simbólica e física", "religiosa e militar", "política e física"], "k": 1, "e": "Separação = psicológica; apagar identidades = simbólica; castigos = física."}, {"id": "h26", "c": "3", "d": 1, "q": "A ordem religiosa que fundou os primeiros colégios e fez a catequese dos indígenas foi:", "a": ["a Companhia de Jesus (jesuítas)", "a Companhia das Índias Ocidentais", "a Ordem de Cristo", "os calvinistas franceses", "os franciscanos holandeses"], "k": 0, "e": "Jesuítas, com Manuel da Nóbrega (1549) e José de Anchieta."}, {"id": "h27", "c": "3", "d": 3, "q": "Uma permanência histórica da sociedade colonial no Brasil atual é:", "a": ["a monarquia portuguesa", "a concentração de terras e a desigualdade social e racial", "o escambo como forma de comércio", "o Governo-Geral em Salvador", "a União Ibérica"], "k": 1, "e": "Latifúndio (sesmarias) e escravidão deixaram marcas na desigualdade de hoje."}, {"id": "h28", "c": "4", "d": 1, "q": "A União Ibérica (1580–1640) foi o período em que:", "a": ["a Holanda governou Portugal", "Portugal e Espanha tiveram o mesmo rei", "o Brasil ficou independente", "a França dominou o Rio de Janeiro", "Portugal perdeu o Brasil para a Inglaterra"], "k": 1, "e": "Começou após a morte de D. Sebastião, com Filipe II no trono português."}, {"id": "h29", "c": "4", "d": 2, "q": "Sobre o governo de Maurício de Nassau em Pernambuco, é correto afirmar que:", "a": ["proibiu todas as religiões que não fossem católicas", "promoveu tolerância religiosa e investiu em urbanismo, ciência e artes, mas continuou sendo uma ocupação estrangeira", "acabou com a escravidão no Nordeste", "expulsou os holandeses em 1654", "foi nomeado pelo rei de Portugal"], "k": 1, "e": "Liberdade de culto, obras no Recife, pintores como Frans Post; ainda assim, ocupação voltada ao lucro."}, {"id": "h30", "c": "4", "d": 3, "q": "A Restauração portuguesa de 1640 e a expulsão dos holandeses em 1654 se relacionam porque:", "a": ["a Restauração expulsou imediatamente os holandeses", "a Restauração devolveu a Portugal um rei próprio, mas os holandeses só foram expulsos depois, pela Insurreição Pernambucana", "os holandeses apoiaram a Restauração e saíram por vontade própria", "a Insurreição Pernambucana aconteceu antes de 1640", "a Espanha expulsou os holandeses em 1654"], "k": 1, "e": "Restauração ≠ expulsão: foram 14 anos de diferença, e a expulsão veio pela Insurreição Pernambucana."}], "cards": [["Escambo", "Troca direta de objetos por produtos ou trabalho, sem dinheiro (pau-brasil)."], ["Feitoria", "Entreposto no litoral para guardar o pau-brasil. Não era cidade."], ["Tratado de Tordesilhas (1494)", "Linha imaginária: leste para Portugal, oeste para a Espanha."], ["Carta de Caminha", "Relato oficial de 1500 ao rei D. Manuel I. Visão portuguesa, não neutra."], ["Martim Afonso de Sousa", "Expedição de 1530; fundou São Vicente (1532)."], ["Capitanias hereditárias (1534)", "15 faixas para 12 donatários; colonização paga por particulares."], ["Donatário", "Administrava a capitania, mas não era dono: não podia vender."], ["Sesmaria", "Grande lote de terra doado para cultivo; origem do latifúndio."], ["Governo-Geral (1549)", "Poder centralizado, ligado ao rei. 1º: Tomé de Sousa."], ["Provedor-mor / Ouvidor-mor / Capitão-mor", "Tributos / justiça / defesa da costa."], ["Mem de Sá", "3º governador-geral; expulsou os franceses."], ["França Antártica", "Colônia francesa de Villegagnon (1555) na Guanabara, com apoio dos tamoios."], ["Estácio de Sá", "Fundou o Rio de Janeiro em 1565."], ["Plantation", "Latifúndio + monocultura + escravidão + exportação."], ["Massapê", "Solo argiloso e fértil do Nordeste, ideal para a cana."], ["Casa-grande", "Casa do senhor de engenho: centro do poder."], ["Senzala", "Moradia das pessoas escravizadas."], ["Moenda", "Onde a cana era moída para tirar o caldo."], ["Mansa Musa", "Rei do Mali (séc. XIV), um dos mais ricos da história."], ["Tombuctu", "Cidade do Mali, centro de comércio e de manuscritos."], ["Manicongo", "Rei do Congo; fez diplomacia com Portugal."], ["Griô", "Guardião da tradição oral na África Ocidental."], ["Sincretismo", "Associar orixás a santos católicos: imposição e resistência."], ["Quilombo dos Palmares", "Alagoas; quase um século; 20 a 30 mil pessoas; destruído em 1694."], ["Zumbi", "Líder de Palmares; morto em 20/11/1695 (Consciência Negra)."], ["Companhia de Jesus", "Jesuítas: catequese e primeiros colégios."], ["Homens livres pobres", "Livres, mas com pouca terra e pouco poder."], ["União Ibérica", "1580–1640: mesmo rei para Portugal e Espanha."], ["Maurício de Nassau", "Governou o Brasil holandês (1637–1644): tolerância e obras."], ["Insurreição Pernambucana", "Expulsou os holandeses em 1654."]], "diss": [{"q": "Em 1534, para ocupar o território sem gastar seus próprios recursos, a Coroa portuguesa dividiu o Brasil em capitanias hereditárias. Poucos anos depois, a maior parte delas estava abandonada ou em crise, e apenas Pernambuco e São Vicente prosperavam. Em 1549, foi criado o Governo-Geral. Compare os dois sistemas, explicando como cada um funcionava, e explique por que Portugal decidiu mudar de modelo.", "r": "Capitanias (1534): território dividido entre donatários, que pagavam a colonização com seus próprios recursos; poder descentralizado e pouco controle do rei. A maioria fracassou por falta de dinheiro, distância, pouco apoio da Coroa e resistência indígena; só Pernambuco e São Vicente prosperaram com o açúcar. Governo-Geral (1549): poder centralizado e ligado ao rei, com provedor-mor (tributos), ouvidor-mor (justiça) e capitão-mor (defesa). Portugal mudou para garantir a posse, defender o território (franceses) e organizar a colônia."}, {"q": "O açúcar foi a principal riqueza do Brasil colonial nos séculos XVI e XVII. Os engenhos do Nordeste eram grandes propriedades, com casa-grande, senzala, capela e moenda, e a produção era voltada à exportação para a Europa. Ainda hoje, o país enfrenta forte concentração de terras e de renda. Explique como a produção de açúcar, o uso do trabalho escravizado e a organização da sociedade colonial estavam relacionados, e cite uma permanência dessa estrutura no Brasil atual.", "r": "O açúcar era produzido para exportar em grandes propriedades (latifúndio) com monocultura, o que exigia muita mão de obra; por isso se usou o trabalho escravizado, primeiro indígena e depois africano. Isso gerou uma sociedade em pirâmide: senhores de engenho no topo (terra, riqueza e poder), homens livres pobres no meio e pessoas escravizadas na base. Essa concentração de terra e poder deixou marcas na desigualdade atual."}, {"q": "Durante o período colonial, milhões de africanos foram trazidos à força para o Brasil e submetidos a violências físicas, simbólicas e psicológicas. Muitos historiadores, porém, defendem que essa população não deve ser vista apenas como vítima, mas também como protagonista da própria história. Explique a frase “Os africanos escravizados não foram apenas vítimas”, usando pelo menos dois exemplos de resistência estudados e uma relação com o Brasil de hoje.", "r": "Apesar da violência física, simbólica e psicológica, os africanos resistiram: preservaram línguas, músicas e religiões, inclusive por meio do sincretismo (orixás associados a santos); fugiram e formaram quilombos, como Palmares, que resistiu quase um século com milhares de pessoas, liderado por Zumbi. A luta continua hoje nas comunidades quilombolas, que buscam reconhecimento e direito à terra."}], "videos": [{"c": "6", "t": "Período pré-colonial: pau-brasil e escambo", "s": "Busca: Me Explica Essa História", "url": "https://www.youtube.com/results?search_query=Me+Explica+Essa+História+período+pré-colonial"}, {"c": "6", "t": "A chegada de Cabral e a Carta de Caminha", "s": "Busca: Eduardo Bueno", "url": "https://www.youtube.com/results?search_query=Eduardo+Bueno+descobrimento+do+Brasil+Cabral"}, {"c": "7", "t": "Resumão do período colonial", "s": "Descomplica", "url": "https://www.youtube.com/watch?v=V9LCaI0vxs4"}, {"c": "7", "t": "Administração colonial: capitanias e Governo-Geral", "s": "Busca: Me Explica Essa História", "url": "https://www.youtube.com/results?search_query=Me+Explica+Essa+História+administração+colonial+Brasil+colônia"}, {"c": "7", "t": "França Antártica e fundação do Rio", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=França+Antártica+Villegagnon+aula"}, {"c": "8", "t": "Economia açucareira e o engenho", "s": "Busca: Me Explica Essa História", "url": "https://www.youtube.com/results?search_query=Me+Explica+Essa+História+economia+açucareira+Brasil+colônia"}, {"c": "1", "t": "Reinos africanos: Mali, Mansa Musa e Congo", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=reinos+africanos+Mali+Congo+Mansa+Musa+aula"}, {"c": "2", "t": "Quilombo dos Palmares e resistência", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=Quilombo+dos+Palmares+aula+resumo"}, {"c": "3", "t": "Sociedade colonial e jesuítas", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=sociedade+colonial+jesuítas+aula+história"}, {"c": "4", "t": "União Ibérica e invasões holandesas", "s": "Busca: Me Explica Essa História", "url": "https://www.youtube.com/results?search_query=Me+Explica+Essa+História+invasões+holandesas+União+Ibérica"}, {"c": "4", "t": "Maurício de Nassau no Brasil", "s": "Busca no YouTube", "url": "https://www.youtube.com/results?search_query=Maurício+de+Nassau+Brasil+holandês+aula"}]};
const HERO_ART="<svg viewBox=\"0 0 220 220\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"g\" cx=\".5\" cy=\".5\" r=\".5\"><stop offset=\"0\" stop-color=\"#FBF3E2\"/><stop offset=\"1\" stop-color=\"#EAD9B8\"/></radialGradient></defs>\n<circle cx=\"110\" cy=\"110\" r=\"104\" fill=\"url(#g)\" stroke=\"#9A3B1C\" stroke-width=\"3\"/><circle cx=\"110\" cy=\"110\" r=\"88\" fill=\"none\" stroke=\"#B8862F\" stroke-width=\"1.5\" stroke-dasharray=\"3 5\"/>\n<g fill=\"#2B1D14\"><path d=\"M110 18L122 110L110 202L98 110Z\"/><path d=\"M18 110L110 98L202 110L110 122Z\" opacity=\".85\"/></g>\n<g fill=\"#9A3B1C\"><path d=\"M110 18L122 110H110Z\"/><path d=\"M202 110L110 122V110Z\"/><path d=\"M110 202L98 110H110Z\"/><path d=\"M18 110L110 98V110Z\"/></g>\n<g fill=\"#B8862F\" opacity=\".9\"><path d=\"M110 50L118 110L110 170L102 110Z\" transform=\"rotate(45 110 110)\"/><path d=\"M110 50L118 110L110 170L102 110Z\" transform=\"rotate(-45 110 110)\"/></g>\n<circle cx=\"110\" cy=\"110\" r=\"9\" fill=\"#FBF3E2\" stroke=\"#2B1D14\" stroke-width=\"2\"/>\n<g font-family=\"Fraunces,serif\" font-weight=\"700\" font-size=\"16\" fill=\"#2B1D14\" text-anchor=\"middle\"><text x=\"110\" y=\"14\">N</text><text x=\"110\" y=\"218\">S</text><text x=\"212\" y=\"116\">L</text><text x=\"8\" y=\"116\">O</text></g></svg>";
const $=s=>document.querySelector(s), app=$('#app');
const S={get(k,d){try{const v=localStorage.getItem(D.key+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(D.key+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const chapName=id=>{const c=D.chapters.find(c=>c.id===id);return c?c.short:id};
const TABS=[['inicio','Início'],['resumo','Resumo'],...D.extraTabs,['simulado','Simulado'],['cards','Flashcards'],...(D.diss.length?[['diss','Dissertativas']]:[]),['videos','Vídeos']];
function tabs(cur){$('#tabs').innerHTML=TABS.map(([k,t])=>`<a href="#k--${k}" class="${cur===k?'on':''}">${t}</a>`).join('');const on=$('#tabs .on'),nv=$('#tabs');if(on)nv.scrollLeft=on.offsetLeft-nv.clientWidth/2+on.offsetWidth/2}
function countdown(){const d=new Date(D.exam+'T07:00:00-03:00')-new Date();const h=Math.max(0,Math.round(d/36e5));$('#cd').textContent=d<=0?'Dia da prova! Boa sorte':(h<48?`Prova em ~${h} h`:`Prova em ${Math.ceil(h/24)} dias`)}

function home(){
 const plan=S.get('plan',[]);const best=S.get('best',null);
 app.innerHTML=`<section class="hero"><div><div class="kick">${D.kicker}</div><h1>${D.heroTitle}</h1><p>${D.heroText}</p>
 <div class="row"><a class="btn" href="#k--resumo">Começar pelo resumo</a><a class="btn g" href="#k--simulado">Fazer simulado</a></div>
 ${best?`<p class="note" style="margin-top:12px">Seu melhor simulado: <b>${best}%</b></p>`:''}</div><div class="art">${HERO_ART}</div></section>
 <h2>Plano para estudar hoje</h2><div class="plan">${D.plan.map((p,i)=>`<label class="${plan.includes(i)?'done':''}"><input type="checkbox" data-i="${i}" ${plan.includes(i)?'checked':''}><span>${p}</span></label>`).join('')}</div>
 <h2>${D.chapWord}</h2><div class="grid">${D.chapters.map(c=>`<a class="tile" href="#k--cap-${c.id}"><div class="n">${c.n}</div><b>${c.title}</b><span>${c.hint}</span></a>`).join('')}</div>`;
 app.querySelectorAll('.plan input').forEach(i=>i.onchange=()=>{let p=S.get('plan',[]);const n=+i.dataset.i;p=i.checked?[...new Set([...p,n])]:p.filter(x=>x!==n);S.set('plan',p);i.parentNode.classList.toggle('done',i.checked)});
}
function chapter(id){
 const i=Math.max(0,D.chapters.findIndex(c=>c.id===id));const c=D.chapters[i];const ess=S.get('ess',false);
 app.innerHTML=`<div class="chipsnav">${D.chapters.map(x=>`<a href="#k--cap-${x.id}" class="${x.id===c.id?'on':''}">${x.n} · ${x.short}</a>`).join('')}</div>
 <article class="chap ${ess?'essential':''}" id="chap"><div class="chap-h"><div class="num">${c.n}</div><div><div class="kick">${D.chapWordOne} ${c.n}</div><h2 style="margin:0">${c.title}</h2></div></div>
 <button class="toggle" id="tg"><i></i>Só o essencial</button>
 <div class="content" style="margin-top:14px">${c.html}</div>
 <div class="pn">${i>0?`<a class="btn g" href="#k--cap-${D.chapters[i-1].id}">← ${D.chapters[i-1].short}</a>`:'<span></span>'}${i<D.chapters.length-1?`<a class="btn" href="#k--cap-${D.chapters[i+1].id}">${D.chapters[i+1].short} →</a>`:`<a class="btn" href="#k--simulado">Ir para o simulado →</a>`}</div></article>`;
 $('#tg').onclick=()=>{const v=!S.get('ess',false);S.set('ess',v);$('#chap').classList.toggle('essential',v)};
 window.scrollTo(0,0);
}
function extra(id){const x=D.extras.find(e=>e.id===id);app.innerHTML=`<article class="chap"><h2>${x.title}</h2><div class="content">${x.html}</div></article>`;window.scrollTo(0,0)}

// ---------- simulado
let Q=null;
function interleave(arr){const g={1:[],2:[],3:[]};arr.sort(()=>Math.random()-.5).forEach(q=>g[q.d].push(q));const pat=[1,2,3,2,1,3,2,3,1,2];const out=[];let k=0;while(out.length<arr.length){const d=pat[k++%pat.length];if(g[d].length)out.push(g[d].shift());else{const o=[1,2,3].find(x=>g[x].length);if(o)out.push(g[o].shift())}}return out}
function setup(){
 const sel=S.get('sel',D.chapters.map(c=>c.id));let n=S.get('n',20);
 app.innerHTML=`<div class="card setup"><div class="kick">Simulado</div><h2>Treine com correção na hora</h2><p class="note">${D.quiz.length} questões ao todo. A ordem mistura fácil, média e difícil. Cada resposta mostra a explicação.</p>
 <h3 style="font-family:var(--hf);margin:16px 0 4px">Quantas questões?</h3><div class="seg" id="qn">${[10,20,30,D.quiz.length].filter((v,i,a)=>a.indexOf(v)===i&&v<=D.quiz.length).map(v=>`<button data-v="${v}" class="${v===n?'on':''}">${v===D.quiz.length?'Todas ('+v+')':v}</button>`).join('')}</div>
 <h3 style="font-family:var(--hf);margin:6px 0 4px">${D.chapWord}</h3>${D.chapters.map(c=>`<label><input type="checkbox" value="${c.id}" ${sel.includes(c.id)?'checked':''}> ${c.n} · ${c.title} <span class="note">(${D.quiz.filter(q=>q.c===c.id).length})</span></label>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn" id="go">Começar</button>${S.get('wrong',[]).length?`<button class="btn g" id="gw">Refazer as que errei (${S.get('wrong',[]).length})</button>`:''}</div></div>`;
 app.querySelectorAll('#qn button').forEach(b=>b.onclick=()=>{n=+b.dataset.v;S.set('n',n);app.querySelectorAll('#qn button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#go').onclick=()=>{const s=[...app.querySelectorAll('.setup input:checked')].map(i=>i.value);if(!s.length)return;S.set('sel',s);start(interleave(D.quiz.filter(q=>s.includes(q.c))).slice(0,n))};
 const gw=$('#gw');if(gw)gw.onclick=()=>start(interleave(D.quiz.filter(q=>S.get('wrong',[]).includes(q.id))));
}
function start(list){Q={list,i:0,ans:[]};showQ()}
function shuffleOpts(q){const idx=q.a.map((_,i)=>i).sort(()=>Math.random()-.5);return idx}
function showQ(){
 const q=Q.list[Q.i];const order=shuffleOpts(q);const DIF={1:['Fácil','f'],2:['Média','m'],3:['Difícil','d']};
 app.innerHTML=`<div class="card"><div class="qtop"><span>Questão ${Q.i+1} de ${Q.list.length}</span><span>✓ ${Q.ans.filter(a=>a).length} · ✗ ${Q.ans.filter(a=>!a).length}</span></div>
 <div class="bar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
 <div class="row" style="gap:8px;align-items:center"><span class="dif ${DIF[q.d][1]}">${DIF[q.d][0]}</span><span class="note">${chapName(q.c)}</span></div>
 <p class="qstem">${q.q}</p><div id="opts">${order.map((oi,j)=>`<button class="opt" data-oi="${oi}"><b>${'ABCDE'[j]}</b><span>${q.a[oi]}</span></button>`).join('')}</div><div id="fb"></div>
 <div class="row" style="justify-content:space-between;margin-top:8px"><button class="btn g" id="quit">Sair</button><button class="btn" id="nx" style="display:none">${Q.i<Q.list.length-1?'Próxima →':'Ver resultado'}</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const oi=+b.dataset.oi, ok=oi===q.k; Q.ans.push(ok);
  app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const xi=+x.dataset.oi;if(xi===q.k)x.classList.add('ok');if(x===b&&!ok){x.classList.add('no');if(q.w&&q.w[xi])x.querySelector('span').insertAdjacentHTML('beforeend',`<small>${q.w[xi]}</small>`)}});
  $('#fb').innerHTML=`<div class="exp ${ok?'ok':'no'}"><b>${ok?'Isso!':'Não foi dessa vez.'}</b> ${q.e}</div>`;
  let w=S.get('wrong',[]);w=ok?w.filter(x=>x!==q.id):[...new Set([...w,q.id])];S.set('wrong',w);
  $('#nx').style.display='inline-flex';$('#nx').focus()});
 $('#nx').onclick=()=>{Q.i++;Q.i<Q.list.length?showQ():result()};$('#quit').onclick=()=>{Q=null;setup()};
 window.scrollTo(0,0);
}
function result(){
 const n=Q.list.length,c=Q.ans.filter(a=>a).length,p=Math.round(c/n*100);if(p>S.get('best',0))S.set('best',p);
 const by={};Q.list.forEach((q,i)=>{by[q.c]=by[q.c]||[0,0];by[q.c][1]++;if(Q.ans[i])by[q.c][0]++});
 app.innerHTML=`<div class="card"><div class="kick">Resultado</div><div class="res-big">${c} / ${n}</div><p>${p>=80?'Muito bem! Revise só as pegadinhas.':p>=60?'Bom! Releia os capítulos com menos acertos.':'Releia o resumo dos capítulos com menos acertos e tente de novo.'}</p>
 <h3 style="font-family:var(--hf)">Por ${D.chapWordOne.toLowerCase()}</h3>${Object.entries(by).map(([k,[a,t]])=>`<div class="tbar"><span>${chapName(k)}</span><i><u style="width:${a/t*100}%"></u></i><b>${a}/${t}</b></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn" id="again">Novo simulado</button>${S.get('wrong',[]).length?`<button class="btn g" id="gw2">Refazer as que errei</button>`:''}</div></div>`;
 $('#again').onclick=setup;const g=$('#gw2');if(g)g.onclick=()=>start(interleave(D.quiz.filter(q=>S.get('wrong',[]).includes(q.id))));
}
// ---------- flashcards
function cards(){
 let deck=D.cards.map((_,i)=>i).sort(()=>Math.random()-.5),k=0,know=0;
 const draw=()=>{if(!deck.length){app.innerHTML=`<div class="card"><h2>Acabou! 🎉</h2><p>Você passou por todos os cartões.</p><button class="btn" id="re">Recomeçar</button></div>`;$('#re').onclick=cards;return}
  const c=D.cards[deck[0]];
  app.innerHTML=`<div class="card"><div class="kick">Flashcards</div><p class="note">Toque no cartão para virar. Faltam ${deck.length} · já sei ${know}</p>
  <div class="flip" id="fl"><div class="in"><div class="f">${c[0]}</div><div class="b">${c[1]}</div></div></div>
  <div class="row" style="justify-content:center"><button class="btn g" id="nk">Ainda não sei</button><button class="btn" id="ok">Já sei ✓</button></div></div>`;
  $('#fl').onclick=()=>$('#fl').classList.toggle('on');
  $('#ok').onclick=()=>{deck.shift();know++;draw()};$('#nk').onclick=()=>{deck.push(deck.shift());draw()}};
 draw();
}
function diss(){
 app.innerHTML=`<div class="card"><div class="kick">Dissertativas</div><h2>Treine a escrita</h2><p class="note">Escreva sua resposta (fica salva neste aparelho) e depois compare com o que a resposta precisa ter.</p>
 ${D.diss.map((d,i)=>`<div class="dq"><p class="qstem">${i+1}. ${d.q}</p><textarea data-i="${i}" placeholder="Escreva aqui...">${esc(S.get('d'+i,''))}</textarea><button class="btn g" data-s="${i}" style="margin-top:6px">Ver o que a resposta precisa ter</button><div class="ans" id="a${i}">${d.r}</div></div>`).join('')}</div>`;
 app.querySelectorAll('textarea').forEach(t=>t.oninput=()=>S.set('d'+t.dataset.i,t.value));
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>$('#a'+b.dataset.s).classList.toggle('show'));
}
function videos(){
 const play='<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff" opacity=".95"/><path d="M26 20l18 12-18 12z" fill="#D7261E"/></svg>';
 app.innerHTML=`<div class="sec-h"><div><div class="kick">Vídeos</div><h2 style="margin:0">Aulas no YouTube</h2></div></div><p class="note">Os vídeos abrem no YouTube. Os marcados como “Busca” mostram uma lista de aulas daquele tema: escolha a de um canal confiável.</p>
 <div class="grid">${D.videos.map(v=>`<a class="vid" href="${v.url}" target="_blank" rel="noopener"><div class="th"><em>${chapName(v.c)}</em>${play}</div><div class="t"><b>${v.t}</b><span>${v.s}</span></div></a>`).join('')}</div>`;
}
function route(){
 const h=(location.hash||'#k--inicio').replace('#k--','');
 const cur=h.startsWith('cap-')?'resumo':h;tabs(cur);
 if(h==='inicio')home();else if(h==='resumo')chapter(D.chapters[0].id);else if(h.startsWith('cap-'))chapter(h.slice(4));
 else if(h==='simulado'){if(!Q)setup()}else if(h==='cards')cards();else if(h==='diss')diss();else if(h==='videos')videos();
 else if(D.extras.find(e=>e.id===h))extra(h);else home();
 if(h!=='simulado')Q=null;
}
window.addEventListener('hashchange',route);countdown();setInterval(countdown,6e4);route();
document.addEventListener('keydown',e=>{if(!Q)return;const k='abcde'.indexOf(e.key.toLowerCase());const o=app.querySelectorAll('.opt');if(k>=0&&o[k]&&!o[k].disabled)o[k].click();if(e.key==='Enter'&&$('#nx')&&$('#nx').style.display!=='none')$('#nx').click()});
</script></body></html>
